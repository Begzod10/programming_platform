name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test-secret-key-for-ci-only-not-used-in-prod
        run: python -m pytest tests/ -v --tb=short

      # Reports known-CVE dependencies on every push — does not fail the
      # build yet. As of 2026-09-11 requirements.txt has 73 known
      # vulnerabilities across 13 packages (all with fix versions
      # available); bumping those is a separate, deliberately-scoped task
      # since several are major-version jumps (starlette, cryptography)
      # that need their own regression pass, not something to gate CI on
      # sight-unseen. Flip this to `pip-audit -r requirements.txt` (no
      # `|| true`) once that cleanup lands, so new vulnerabilities fail
      # the build going forward.
      - name: Audit dependencies for known vulnerabilities
        working-directory: backend
        run: |
          pip install -q pip-audit
          pip-audit -r requirements.txt || true

  frontend:
    name: Frontend (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run tests
        working-directory: frontend
        env:
          CI: "true"
        run: npx react-scripts test --watchAll=false --passWithNoTests
