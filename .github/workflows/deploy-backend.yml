name: Deploy Backend

# Restart the backend service on the prod server whenever Python source,
# migrations, or requirements change on the server branch.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST         — prod IP (e.g. 5.129.242.151)
#   SSH_USER         — SSH login (e.g. root)
#   SSH_PRIVATE_KEY  — private key whose public half is in authorized_keys
#   SSH_PORT         — optional; defaults to 22
#   BACKEND_DIR      — absolute path to the backend on the server
#                      (e.g. /home/deploy/student_platform/backend)
#   SERVICE_NAME     — systemd service name (e.g. student-platform-backend)

on:
  push:
    branches: [server]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull & restart backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST:        ${{ secrets.SSH_HOST }}
          SSH_PORT:        ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Pull latest code and restart service
        env:
          SSH_HOST:     ${{ secrets.SSH_HOST }}
          SSH_USER:     ${{ secrets.SSH_USER }}
          SSH_PORT:     ${{ secrets.SSH_PORT }}
          BACKEND_DIR:  ${{ secrets.BACKEND_DIR }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/deploy_key \
              -p "$PORT" \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              "set -e
               echo '--- diag: before pull ---'
               echo pwd=\$(pwd)
               git -C \"$BACKEND_DIR\" rev-parse --abbrev-ref HEAD
               git -C \"$BACKEND_DIR\" log -1 --format='HEAD=%H %s'
               git -C \"$BACKEND_DIR\" status --short | head -5
               git -C \"$BACKEND_DIR\" pull origin server
               echo '--- diag: after pull ---'
               git -C \"$BACKEND_DIR\" rev-parse --abbrev-ref HEAD
               git -C \"$BACKEND_DIR\" log -1 --format='HEAD=%H %s'
               grep -n '^AI_PROVIDER_CHAIN' \"$BACKEND_DIR/.env\" || echo 'AI_PROVIDER_CHAIN not set in .env (uses code default)'
               echo '--- diag: systemd unit ---'
               systemctl show \"$SERVICE_NAME\" -p ExecStart -p WorkingDirectory -p FragmentPath
               cd \"$BACKEND_DIR\"
               source venv/bin/activate
               pip install -r requirements.txt --quiet
               systemctl restart \"$SERVICE_NAME\"
               systemctl is-active --quiet \"$SERVICE_NAME\" && echo 'Service is running' || { echo 'Service failed to start'; systemctl status \"$SERVICE_NAME\" --no-pager; exit 1; }
               echo '--- diag: live OpenAI call from prod host (no secrets printed) ---'
               echo  | base64 -d | python3 || echo 'diag script errored (see above)'"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
